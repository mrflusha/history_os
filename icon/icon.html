<!-- DEEPSEEK ICON -->


<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OS History Icon</title>
  <style>
    body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    svg { width: 576px; height: 576px; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="576" height="576" viewBox="0 0 576 576">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0077FF"/>
        <stop offset="100%" stop-color="#6a11cb"/>
      </linearGradient>
      <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e1e2e"/>
        <stop offset="100%" stop-color="#0d0d15"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00ffaa"/>
        <stop offset="100%" stop-color="#00c8ff"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
      </filter>
    </defs>

    <!-- Background -->
    <rect width="576" height="576" rx="120" fill="url(#bg)"/>

    <!-- Subtle grid pattern -->
    <g opacity="0.08">
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#fff" stroke-width="1"/>
      </pattern>
      <rect width="576" height="576" rx="120" fill="url(#grid)"/>
    </g>

    <!-- Terminal window -->
    <g filter="url(#shadow)">
      <rect x="96" y="136" width="384" height="304" rx="28" fill="url(#term)"/>
      <!-- Title bar -->
      <rect x="96" y="136" width="384" height="56" rx="28" fill="#2a2a3e"/>
      <rect x="96" y="164" width="384" height="28" fill="#2a2a3e"/>
      <!-- Traffic lights -->
      <circle cx="132" cy="164" r="10" fill="#ff5f57"/>
      <circle cx="164" cy="164" r="10" fill="#febc2e"/>
      <circle cx="196" cy="164" r="10" fill="#28c840"/>
    </g>

    <!-- Prompt text -->
    <text x="132" y="280" font-family="'Courier New', monospace" font-size="48" font-weight="700" fill="url(#accent)">$ history</text>

    <!-- Command lines -->
    <rect x="132" y="312" width="240" height="8" rx="4" fill="#3a3a4e"/>
    <rect x="132" y="336" width="180" height="8" rx="4" fill="#3a3a4e"/>
    <rect x="132" y="360" width="280" height="8" rx="4" fill="#3a3a4e"/>

    <!-- Cursor -->
    <rect x="132" y="392" width="20" height="28" fill="#00ffaa">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- History arrow (curved, going back) -->
    <g transform="translate(400, 380)">
      <path d="M 40 0 A 40 40 0 1 1 0 -40" stroke="#00c8ff" stroke-width="6" fill="none" stroke-linecap="round"/>
      <polygon points="-8,-40 0,-52 8,-40" fill="#00c8ff"/>
    </g>
  </svg>
</body>
</html>
