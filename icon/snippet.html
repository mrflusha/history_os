<!-- DEEPSEEK make snippet -->

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OS History — OG-баннер 1120×630</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0f0f14;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  svg.banner { display: block; width: 1120px; height: 630px; }
</style>
</head>
<body>
<svg class="banner" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 630" width="1120" height="630"
     role="img" aria-label="История операционных систем — Unix, Linux, DOS, BSD">
  <defs>
    <!-- Фон -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0077FF"/>
      <stop offset="0.55" stop-color="#5b3ce0"/>
      <stop offset="1"    stop-color="#8a1eff"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Терминал -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252538"/>
      <stop offset="1" stop-color="#10101a"/>
    </linearGradient>
    <linearGradient id="termBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35354f"/>
      <stop offset="1" stop-color="#252538"/>
    </linearGradient>

    <!-- Акцент -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFB2"/>
      <stop offset="1" stop-color="#00C8FF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Фон -->
  <rect width="1120" height="630" fill="url(#bgGrad)"/>
  <rect width="1120" height="630" fill="url(#bgGlow)"/>
  <rect width="1120" height="630" fill="url(#gridPattern)" opacity="0.06"/>

  <!-- Декоративные кольца -->
  <circle cx="960" cy="140" r="340" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
  <circle cx="960" cy="140" r="280" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="120" cy="560" r="220" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- ЛЕВАЯ ЧАСТЬ: заголовок -->
  <g>
    <!-- Метка-бейдж -->
    <g transform="translate(80 120)">
      <rect x="0" y="0" width="196" height="44" rx="22"
            fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <circle cx="26" cy="22" r="7" fill="url(#accentGrad)"/>
      <text x="44" y="29"
            font-family="'JetBrains Mono','Fira Code','Menlo','Courier New',monospace"
            font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">
        VK MINI APP
      </text>
    </g>

    <!-- Главный заголовок -->
    <text x="80" y="270"
          font-family="'Segoe UI','SF Pro Display',system-ui,sans-serif"
          font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">
      История
    </text>
    <text x="80" y="366"
          font-family="'Segoe UI','SF Pro Display',system-ui,sans-serif"
          font-size="88" font-weight="800" letter-spacing="-2"
          fill="url(#accentGrad)" filter="url(#glow)">
      операционных систем
    </text>

    <!-- Подзаголовок -->
    <text x="82" y="424"
          font-family="'Segoe UI','SF Pro Text',system-ui,sans-serif"
          font-size="26" font-weight="500" fill="rgba(255,255,255,0.80)">
      Unix · Linux · MS-DOS · BSD · Debian · Arch
    </text>

    <!-- Метки-чипы -->
    <g transform="translate(80 480)"
       font-family="'JetBrains Mono','Fira Code','Menlo',monospace"
       font-size="18" font-weight="700">
      <g>
        <rect x="0" y="0" width="96"  height="42" rx="21" fill="rgba(255,255,255,0.10)"/>
        <text x="48" y="27" text-anchor="middle" fill="#ffffff">Unix</text>
      </g>
      <g transform="translate(108 0)">
        <rect x="0" y="0" width="112" height="42" rx="21" fill="rgba(255,255,255,0.10)"/>
        <text x="56" y="27" text-anchor="middle" fill="#ffffff">Linux</text>
      </g>
      <g transform="translate(232 0)">
        <rect x="0" y="0" width="116" height="42" rx="21" fill="rgba(255,255,255,0.10)"/>
        <text x="58" y="27" text-anchor="middle" fill="#ffffff">MS-DOS</text>
      </g>
      <g transform="translate(360 0)">
        <rect x="0" y="0" width="90"  height="42" rx="21" fill="rgba(255,255,255,0.10)"/>
        <text x="45" y="27" text-anchor="middle" fill="#ffffff">BSD</text>
      </g>
    </g>
  </g>

  <!-- ПРАВАЯ ЧАСТЬ: терминал -->
  <g transform="translate(612 108)" filter="url(#softShadow)">
    <rect x="0" y="0" width="440" height="420" rx="28"
          fill="url(#termBg)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

    <!-- Шапка окна -->
    <path d="M 32 0 L 408 0 Q 440 0 440 32 L 440 56 L 0 56 L 0 32 Q 0 0 32 0 Z"
          fill="url(#termBar)"/>
    <line x1="0" y1="56" x2="440" y2="56"
          stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Светофоры -->
    <circle cx="30"  cy="28" r="8" fill="#FF5F57"/>
    <circle cx="56"  cy="28" r="8" fill="#FEBC2E"/>
    <circle cx="82"  cy="28" r="8" fill="#28C840"/>

    <!-- Часы -->
    <g transform="translate(408 28)"
       stroke="rgba(255,255,255,0.55)" stroke-width="2.2"
       fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="11"/>
      <path d="M 0 -6 L 0 0 L 5 2.5"/>
    </g>

    <!-- Команда -->
    <text x="36" y="140"
          font-family="'JetBrains Mono','Fira Code','Menlo','Courier New',monospace"
          font-size="40" font-weight="700"
          fill="url(#accentGrad)" filter="url(#glow)">$ history</text>

    <!-- Строки вывода -->
    <rect x="36" y="176" width="250" height="9" rx="4.5" fill="#3a3a52"/>
    <rect x="36" y="200" width="190" height="9" rx="4.5" fill="#3a3a52"/>
    <rect x="36" y="224" width="290" height="9" rx="4.5" fill="#3a3a52"/>

    <!-- Мини-хронология -->
    <g transform="translate(36 268)"
       font-family="'JetBrains Mono','Fira Code','Menlo',monospace" font-size="17">
      <text fill="#7a7a92">1969</text>
      <text x="60" y="0" fill="#00FFB2" font-weight="700">Unix</text>

      <text y="34" fill="#7a7a92">1981</text>
      <text x="60" y="34" fill="#00C8FF" font-weight="700">MS-DOS</text>

      <text y="68" fill="#7a7a92">1991</text>
      <text x="60" y="68" fill="#00FFB2" font-weight="700">Linux</text>

      <text y="102" fill="#7a7a92">1993</text>
      <text x="60" y="102" fill="#00C8FF" font-weight="700">Debian</text>
    </g>

    <!-- Курсор -->
    <rect x="36" y="384" width="18" height="24" rx="3" fill="#00FFB2">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
</body>
</html>
